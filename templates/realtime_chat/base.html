<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Realtime Chat{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'realtime_chat/chat.css' %}">
</head>
<body>
    <div class="app-shell">
        {% if messages %}
            <div class="flash-stack">
                {% for message in messages %}
                    <div class="flash flash-{{ message.tags|default:'info' }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
